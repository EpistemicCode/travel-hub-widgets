  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { font-size: clamp(14px, 2.2vw, 20px); }

  html, body {
    width: 100%; height: 100%;
    margin: 0; padding: 0;
    overflow: hidden;
    background: transparent;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;

    z-index: 0;
  }

  /* ── Widget shell ── */
  .quote-widget {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg, #191919);
    overflow: hidden;
    container-type: inline-size;
  }

  /* ── Language pill row ── */
  .lang-bar {
    position: relative; z-index: 10;
    display: flex; justify-content: flex-end; align-items: center;
    padding: 10px 14px 0;

  .lang-btn {
    background: none; border: none; border-radius: 20px;
    padding: 3px 8px;
    font-family: var(--font-ui);
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint);
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .lang-btn:hover { color: var(--text-dim); background: rgba(255,255,255,0.05); }
  .lang-btn.active {
    color: var(--accent);
    background: var(--accent-soft);
  }

  /* ── Main stage — clicks here = next ── */
  .quote-stage {
    flex: 1; position: relative; z-index: 5;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: clamp(16px, 4cqi, 48px) clamp(16px, 4cqi, 48px) 8px;
    cursor: pointer;
    user-select: none;
    min-height: 0;
  }

  /* ── Decorative glyph (✦ replaces the large " of quote widget) ── */
  .deco-glyph {
    position: absolute;
    top: 12px; left: 24px;
    font-family: var(--font-serif);
    font-size: clamp(20px, 5cqi, 40px);
    line-height: 1;
    color: var(--accent);
    pointer-events: none;
    user-select: none;
    z-index: 0;
    font-style: normal;
    opacity: 0.55;
  }

  /* ── Card (fade-able content) ── */
  .quote-card {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; text-align: center;
    max-width: clamp(280px, 80cqi, 700px); width: 100%;
    transition: opacity var(--transition), transform var(--transition);
  }
  .quote-card.fade-out {
    opacity: 0;
    transform: translateY(8px);
  }
  .quote-card.fade-in {
    opacity: 1;
    transform: translateY(0);
  }

  /* ── Category label (e.g. TECH · ITEM 14 / 50) ── */
  .item-category {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--font-ui);
    font-size: clamp(8px, 1.1cqi, 11px);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    font-variant: small-caps;

  .category-dash {
    display: inline-block;
    width: 14px; height: 1px;
    background: var(--pink);
    flex-shrink: 0;

    color: var(--text);
    letter-spacing: 0.01em;
    margin-bottom: 16px;

  .quote-author {

    font-style: italic;

    letter-spacing: 0.03em;
    color: var(--text-dim);

  .quote-cta.cta-pending {
    opacity: 0.35;
    cursor: default;
    text-decoration: none !important;
    pointer-events: none;
  }

  /* ── Nav arrows ── */
  .nav-arrows {
    position: absolute; inset: 0; z-index: 8;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px;
    pointer-events: none;

    background: none; border: none;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-faint);
    font-size: 18px;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.25s, background 0.15s, color 0.15s;

  .nav-btn:hover { background: rgba(255,255,255,0.07); color: var(--accent); }

  /* ── Progress dots ── */
  .progress-bar {
    position: relative; z-index: 10;
    display: flex; justify-content: center; align-items: center;
    gap: 5px;
    padding: 4px 14px 6px;
    flex-shrink: 0;

  .dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-faint);
    transition: background 0.3s, transform 0.3s;
    cursor: pointer;

  .dot.active {

    position: relative; z-index: 10;
    height: 1px;
    background: var(--line);
    flex-shrink: 0;

  .timer-fill {

</style>

// ── GA4 helpers ───────────────────────────────────────────────────────────────
function gaEvent(name, params) {
  if (window.gtag) {
    gtag('event', name, Object.assign({ widget: 'gear' }, params));
  }
}

// ── Language ──────────────────────────────────────────────────────────────────
function setLanguage(lang, fromChange) {
  const prev = currentLang;
  currentLang = lang;
  try { localStorage.setItem(LS_LANG_KEY, lang); } catch(_) {}

  langBar.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });

  renderItemContent(QUOTES[currentIndex], false);
  renderFooterCta();

  if (fromChange && prev !== lang) {
    gaEvent('language_change', { from: prev, to: lang });
  }
}

function getWhy(item, lang) {
  return (item.why[lang] && item.why[lang].trim()) ? item.why[lang] : item.why['en'];
}

function getCtaStr(map, lang) {
  return map[lang in map ? lang : 'en'];
}

// ── Footer CTA render ─────────────────────────────────────────────────────────
function renderFooterCta() {
  footerCtaEl.textContent = getCtaStr(CTA_FOOTER, currentLang);
  const pending = AMAZON_FOOTER_URL === 'AMAZON_FOOTER_PLACEHOLDER';
  if (pending) {
    footerCtaEl.classList.add('cta-pending');
    footerCtaEl.setAttribute('aria-disabled', 'true');
    footerCtaEl.href = '#';
  } else {
    footerCtaEl.classList.remove('cta-pending');
    footerCtaEl.removeAttribute('aria-disabled');
    footerCtaEl.href = AMAZON_FOOTER_URL;
  }
}

// ── Progress dots ─────────────────────────────────────────────────────────────
function buildDots() {
  progressBar.innerHTML = '';
  const total = QUOTES.length;
  const show  = Math.min(total, 10);
  for (let i = 0; i < show; i++) {
    const dot = document.createElement('div');
    dot.className = 'dot' + (i === currentIndex % show ? ' active' : '');
    dot.setAttribute('aria-label', `Item ${i + 1}`);
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      const target = Math.floor(currentIndex / show) * show + i;
      goTo(target < total ? target : i, true);
    });
    progressBar.appendChild(dot);
  }
}

function updateDots() {
  const show = Math.min(QUOTES.length, 10);
  const active = currentIndex % show;
  progressBar.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === active);
  });
}

// ── Timer bar ─────────────────────────────────────────────────────────────────
function startTimerBar() {
  timerStart = performance.now();
  cancelAnimationFrame(timerRafId);
  function frame(now) {
    if (isPaused) { timerRafId = requestAnimationFrame(frame); return; }
    const elapsed = now - timerStart;
    const pct = Math.min(100, (elapsed / ROTATION_MS) * 100);
    timerFill.style.width = pct + '%';
    if (pct < 100) timerRafId = requestAnimationFrame(frame);
  }
  timerRafId = requestAnimationFrame(frame);
}

function resetTimerBar() {
  cancelAnimationFrame(timerRafId);
  timerFill.style.width = '0%';
}

// ── Auto-advance ──────────────────────────────────────────────────────────────
function startAutoRotation() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(() => {
    if (!isPaused) advance(1);
  }, ROTATION_MS);
}

function stopAutoRotation() {
  clearTimeout(autoTimer);
}

// ── Engagement timer ──────────────────────────────────────────────────────────
function startEngageTimer(item) {
  clearTimeout(engageTimer);
  engageTimer = setTimeout(() => {
    gaEvent('item_engaged', {
      item_id:  item.id,
      category: item.category,
      language: currentLang,
    });
  }, ENGAGED_MS);
}

// ── Render item content (no transition) ──────────────────────────────────────
function renderItemContent(item, fireGA) {
  // Category label: e.g. "TECH · ITEM 14 / 50"
  categoryLbl.textContent = item.category.toUpperCase() + ' · ITEM ' + item.id + ' / ' + QUOTES.length;

  // Name — product names are universal, no translation
  textEl.textContent = item.name;

  // Why-line
  authorEl.textContent = getWhy(item, currentLang);

  // Per-item CTA
  const ctaText    = getCtaStr(CTA_ITEM, currentLang);
  ctaEl.textContent = ctaText;
  const pending = item.amazonUrl === 'AMAZON_LINK_PLACEHOLDER';
  if (pending) {
    // User fills these in later; CTA shows but is disabled
    ctaEl.classList.add('cta-pending');
    ctaEl.setAttribute('aria-disabled', 'true');
    ctaEl.href = '#';
  } else {
    ctaEl.classList.remove('cta-pending');
    ctaEl.removeAttribute('aria-disabled');
    ctaEl.href = item.amazonUrl;
  }
  ctaEl.dataset.pending = pending ? 'true' : 'false';

  if (fireGA) {
    gaEvent('item_view', {
      item_id:  item.id,
      category: item.category,
      language: currentLang,
    });
  }
}

// ── Transition to an item ─────────────────────────────────────────────────────
function goTo(index, manual) {
  if (isFading) return;
  isFading = true;

  stopAutoRotation();
  clearTimeout(engageTimer);
  resetTimerBar();

  card.classList.remove('fade-in');
  card.classList.add('fade-out');

  setTimeout(() => {
    currentIndex = ((index % QUOTES.length) + QUOTES.length) % QUOTES.length;
    const item   = QUOTES[currentIndex];

    renderItemContent(item, true);
    renderFooterCta();
    updateDots();

    card.classList.remove('fade-out');
    card.classList.add('fade-in');

    isFading = false;

    startEngageTimer(item);
    startAutoRotation();
    startTimerBar();
  }, 620);
}

function advance(dir) {
  goTo(currentIndex + dir, false);
}

// ── Per-item CTA click ────────────────────────────────────────────────────────
ctaEl.addEventListener('click', (e) => {
  e.stopPropagation();
  const item = QUOTES[currentIndex];
  // If placeholder, block navigation
  if (item.amazonUrl === 'AMAZON_LINK_PLACEHOLDER') {
    e.preventDefault();
    return;
  }
  gaEvent('item_cta_click', {
    item_id:  item.id,
    category: item.category,
    language: currentLang,
    cta_type: 'item',
  });
});

// ── Footer CTA click ──────────────────────────────────────────────────────────
footerCtaEl.addEventListener('click', (e) => {
  e.stopPropagation();
  if (AMAZON_FOOTER_URL === 'AMAZON_FOOTER_PLACEHOLDER') {
    e.preventDefault();
    return;
  }
  const item = QUOTES[currentIndex];
  gaEvent('item_cta_click', {
    item_id:  item.id,
    category: item.category,
    language: currentLang,
    cta_type: 'footer',
  });
});

// ── Stage click = next ────────────────────────────────────────────────────────
stage.addEventListener('click', (e) => {
  if (e.target === ctaEl || ctaEl.contains(e.target)) return;
  advance(1);
});

// ── Arrow buttons ─────────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', (e) => {
  e.stopPropagation();
  advance(-1);
});
document.getElementById('btn-next').addEventListener('click', (e) => {
  e.stopPropagation();
  advance(1);
});

// ── Pause on hover ────────────────────────────────────────────────────────────
widgetEl.addEventListener('mouseenter', () => { isPaused = true; });
widgetEl.addEventListener('mouseleave', () => { isPaused = false; });

// ── Language bar clicks ───────────────────────────────────────────────────────
langBar.addEventListener('click', (e) => {
  const btn = e.target.closest('.lang-btn');
  if (!btn) return;
  e.stopPropagation();
  setLanguage(btn.dataset.lang, true);
});

// ── Init ──────────────────────────────────────────────────────────────────────
try {
  // Restore language
  try {
    const saved = localStorage.getItem(LS_LANG_KEY);
    if (saved && ['en','es','fr','ja','zh','ko'].includes(saved)) {
      currentLang = saved;
      langBar.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === currentLang);
      });
    }
  } catch(_) {}

  // GA4 widget view
  if (window.gtag) {
    gtag('event', 'widget_view', { widget: 'gear', language: currentLang });
    gtag('set', { 'widget': 'gear' });
  }

  // Build UI
  buildDots();
  renderFooterCta();

  const initItem = QUOTES[currentIndex];
  renderItemContent(initItem, true);
  card.classList.add('fade-in');

  startEngageTimer(initItem);
  startAutoRotation();
  startTimerBar();

} catch(err) {
  showFallback();
}
</script>
</body>
</html>
