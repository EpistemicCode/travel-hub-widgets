<!DOCTYPE html>
<!-- Quiet Atlas photo-forward cover compositor. Open as ?preset=hub&photo=photos/hub.jpg
     Photo fills the cover; brand title overlays with a legibility scrim. Render at the preset's exact viewport. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--cream:#F4EFE6;--terracotta:#C46A4A;}
  *{margin:0;box-sizing:border-box;}
  html,body{background:transparent;}
  #cover{position:relative;overflow:hidden;background:#e9e2d6;}
  #cover img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  #cover .scrim{position:absolute;inset:0;
    background:linear-gradient(102deg, rgba(20,28,38,0.66) 0%, rgba(20,28,38,0.30) 40%, rgba(20,28,38,0) 68%);}
  #cover .overlay{position:absolute;left:0;bottom:0;}
  .eyebrow{font-family:'JetBrains Mono',monospace;text-transform:uppercase;color:rgba(244,239,230,0.92);}
  .title{font-family:'Fraunces',Georgia,serif;font-weight:400;color:#F8F3EA;line-height:1.04;}
  .subtitle{font-family:'Fraunces',Georgia,serif;font-style:italic;color:rgba(244,239,230,0.86);}
  .accent{background:var(--terracotta);border-radius:2px;}
  #missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;color:#9a8f80;font-size:14px;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>
<div id="cover"></div>
<script>
const PRESETS = {
  hub:       {w:1500,h:600, eyebrow:"QUIET ATLAS · TRAVEL PLANNING OS", title:"Travel Planning OS", subtitle:"plan it once, live it fully"},
  trips:     {w:1500,h:400, eyebrow:"MODULE · TRIPS",     title:"Every trip, one place."},
  itinerary: {w:1500,h:400, eyebrow:"MODULE · ITINERARY", title:"Day by day."},
  stays:     {w:1500,h:400, eyebrow:"MODULE · STAYS",     title:"Rest easy."},
  eats:      {w:1500,h:400, eyebrow:"MODULE · EATS",      title:"Taste the place."},
  transit:   {w:1500,h:400, eyebrow:"MODULE · TRANSIT",   title:"Get there."},
  packing:   {w:1500,h:400, eyebrow:"MODULE · PACKING",   title:"Pack light."},
  expenses:  {w:1500,h:400, eyebrow:"MODULE · EXPENSES",  title:"Every dollar."},
  documents: {w:1500,h:400, eyebrow:"MODULE · DOCUMENTS", title:"Papers, sorted."},
  contacts:  {w:1500,h:400, eyebrow:"MODULE · CONTACTS",  title:"Help, on hand."},
  banner:    {w:1500,h:300, eyebrow:"QUIET ATLAS",            title:"where to next"}
};
const q = new URLSearchParams(location.search);
const preset = q.get('preset') || 'hub';
const p = PRESETS[preset] || PRESETS.hub;
const photo = q.get('photo') || ('photos/' + preset + '.jpg');
const pad = Math.round(p.h * 0.13);
const titleSize = preset === 'banner' ? Math.round(p.h*0.21) : Math.round(p.h*0.16);
const eyeSize = Math.max(12, Math.round(p.h*0.028));
const cover = document.getElementById('cover');
cover.style.width = p.w + 'px';
cover.style.height = p.h + 'px';
cover.innerHTML =
  '<img class="photo" src="' + photo + '" alt="" onerror="document.getElementById(\'missing\').style.display=\'flex\'">' +
  '<div class="scrim"></div>' +
  '<div class="overlay" style="padding:' + pad + 'px;">' +
    '<div class="eyebrow" style="font-size:' + eyeSize + 'px;letter-spacing:' + (eyeSize*0.18) + 'px;margin-bottom:' + Math.round(p.h*0.03) + 'px;">' + p.eyebrow + '</div>' +
    '<div class="title" style="font-size:' + titleSize + 'px;">' + p.title + '</div>' +
    (p.subtitle ? '<div class="subtitle" style="font-size:' + Math.round(titleSize*0.34) + 'px;margin-top:' + Math.round(p.h*0.025) + 'px;">' + p.subtitle + '</div>' : '') +
    '<div class="accent" style="width:' + Math.round(p.h*0.13) + 'px;height:3px;margin-top:' + Math.round(p.h*0.055) + 'px;"></div>' +
  '</div>' +
  '<div id="missing" style="display:none;">DROP YOUR PHOTO AT<br>covers/photos/' + preset + '.jpg</div>';
</script>
</body>
</html>
